name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Redaction gate first — no local paths / secrets may enter committed source.
      - run: node scripts/redaction-gate.mjs --selftest
      - run: node scripts/redaction-gate.mjs --enforce

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
